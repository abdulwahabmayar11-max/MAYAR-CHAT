<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وب‌سایت شخصی من</title>
    <style>
        /* تنظیم پس‌زمینه کل صفحه */
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* تنظیم ابعاد دقیق 9:16 برای قاب سایت */
        .phone-container {
            width: 100%;
            max-width: 410px; /* عرض استاندارد گوشی */
            height: calc(410px * 16 / 9); /* محاسبه ارتفاع بر اساس نسبت 16:9 */
            max-height: 820px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow-y: auto; /* فعال شدن اسکرول داخلی در صورت زیاد شدن متن */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
            color: white;
        }

        /* بخش محتوای داخلی */
        .content {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            color: #333;
            text-align: center;
        }
        h1 {
            color: #764ba2;
            margin-top: 0;
            font-size: 22px;
        }
        .about-section {
            background: #f1f3f9;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .social-buttons {
            margin: 15px 0;
        }
        .btn {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
        }
        .instagram { background-color: #e1306c; }
        .telegram { background-color: #0088cc; }
        .whatsapp { background-color: #25d366; }
        .btn:hover { opacity: 0.9; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .gallery img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* بخش فوتر و نام شما در پایین صفحه */
        .footer {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- قاب اصلی با نسبت 9:16 -->
    <div class="phone-container">
        
        <!-- محتوای سایت -->
        <div class="content">
            <h1>به وب‌سایت من خوش آمدید!</h1>
            
            <div class="about-section">
                <h3>درباره من</h3>
                <p>سلام! من عبدالوهاب هستم. این وب‌سایت شخصی من است که در آن فعالیت‌ها، علایق و نمونه‌کارهایم را به اشتراک می‌گذارم.</p>
            </div>

            <h3>گالری تصاویر</h3>
            <div class="gallery">
                <img src="https://picsum.photos" alt="تصویر ۱">
                <img src="https://picsum.photos" alt="تصویر ۲">
            </div>

            <h3>ارتباط با من</h3>
            <div class="social-buttons">
                <a href="https://instagram.com" target="_blank" class="btn instagram">اینستاگرام</a>
                <a href="https://t.me" target="_blank" class="btn telegram">تلگرام</a>
                <a href="https://wa.me" target="_blank" class="btn whatsapp">واتس‌اپ</a>
            </div>
        </div>

        <!-- نام شما در پایین ترین قسمت قاب -->
        <div class="footer">
            عبدالوهاب مایار
        </div>

    </div>

</body>
</html>
