<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdulwahab Mayar Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #11141a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* Strict 16:9 Mobile Frame */
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: calc(410px * 16 / 9);
            max-height: 820px;
            background: #171b26;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
        }

        /* Top Brand Header */
        .brand-name {
            color: #29b6f6;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 5px;
            font-family: 'Arial Black', sans-serif;
            direction: ltr;
        }

        /* Calculator Display Screen */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: right;
            padding: 20px 10px;
            direction: ltr;
        }

        .expression {
            color: #6c7a9c;
            font-size: 20px;
            margin-bottom: 10px;
            min-height: 24px;
            word-wrap: break-word;
        }

        .result {
            color: #ffffff;
            font-size: 44px;
            font-weight: bold;
            word-wrap: break-word;
        }

        /* Keyboard Layout */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            height: 65px;
            border: none;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            background: #222836;
            color: #ffffff;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn.operator {
            color: #29b6f6;
            background: #1e2538;
        }

        .btn.clear {
            color: #ef5350;
            background: #1e2538;
        }

        .btn.equal {
            background: #29b6f6;
            color: #ffffff;
        }

        /* Bottom Footer */
        .footer {
            text-align: center;
            font-size: 15px;
            color: #6c7a9c;
            margin-top: 20px;
            border-top: 1px solid #222836;
            padding-top: 10px;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <!-- Top Display Name -->
        <div class="brand-name">Abdulwahab Mayar</div>

        <!-- Math Screen -->
        <div class="display-container">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <!-- Keypad -->
        <div class="buttons">
            <button class="btn clear" onclick="clearAll()">C</button>
            <button class="btn operator" onclick="backspace()">⌫</button>
            <button class="btn operator" onclick="press('%')">%</button>
            <button class="btn operator" onclick="press('/')">÷</button>
            
            <button class="btn" onclick="press('7')">7</button>
            <button class="btn" onclick="press('8')">8</button>
            <button class="btn" onclick="press('9')">9</button>
            <button class="btn operator" onclick="press('*')">×</button>
            
            <button class="btn" onclick="press('4')">4</button>
            <button class="btn" onclick="press('5')">5</button>
            <button class="btn" onclick="press('6')">6</button>
            <button class="btn operator" onclick="press('-')">-</button>
            
            <button class="btn" onclick="press('1')">1</button>
            <button class="btn" onclick="press('2')">2</button>
            <button class="btn" onclick="press('3')">3</button>
            <button class="btn operator" onclick="press('+')">+</button>
            
            <button class="btn" onclick="press('00')">00</button>
            <button class="btn" onclick="press('0')">0</button>
            <button class="btn" onclick="press('.')">.</button>
            <button class="btn equal" onclick="calculate()">=</button>
        </div>

        <!-- Bottom Footer Name -->
        <div class="footer">
            Abdulwahab Mayar
        </div>

    </div>

    <script>
        let expressionDiv = document.getElementById('expression');
        let resultDiv = document.getElementById('result');
        let isCalculated = false;

        function press(value) {
            if (isCalculated) {
                if (['+', '-', '*', '/', '%'].includes(value)) {
                    expressionDiv.innerText = resultDiv.innerText;
                } else {
                    expressionDiv.innerText = '';
                }
                isCalculated = false;
            }
            expressionDiv.innerText += value;
        }

        function clearAll() {
            expressionDiv.innerText = '';
            resultDiv.innerText = '0';
            isCalculated = false;
        }

        function backspace() {
            if (isCalculated) return;
            expressionDiv.innerText = expressionDiv.innerText.slice(0, -1);
        }

        function calculate() {
            try {
                let exp = expressionDiv.innerText;
                if (!exp) return;
                
                let formattedExp = exp.replace(/×/g, '*').replace(/÷/g, '/');
                let res = eval(formattedExp);
                
                resultDiv.innerText = res;
                isCalculated = true;
            } catch (err) {
                resultDiv.innerText = 'Error';
                isCalculated = true;
            }
        }
    </script>

</body>
</html>
